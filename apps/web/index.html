<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <meta name="theme-color" content="#080810" />
    <!-- Session 50 — set data-theme before React/ThemeContext mount, not
         after, so a light-mode user doesn't see one dark-palette frame
         flash before the ThemeProvider effect runs (see ThemeContext.tsx's
         header note on why localStorage is the synchronous-paint layer).
         Deliberately inline here rather than in main.tsx: this has to run
         and finish before first paint, which a module script's execution
         timing doesn't guarantee the way a blocking inline <script> does. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nexus-theme');
          if (stored === 'light') document.documentElement.dataset.theme = 'light';
        } catch (e) {
          /* localStorage unavailable (privacy mode, etc.) — fall back to
             the default dark palette that :root already renders. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
