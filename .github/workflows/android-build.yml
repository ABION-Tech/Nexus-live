name: Android APK build

# PRD §5 / §16 — Capacitor packages the same React build; this workflow
# is the actual place the APK gets produced. It can't be built inside a
# sandboxed dev tool: assembling an Android app needs the Gradle
# distribution (services.gradle.org), the Android Gradle Plugin and every
# androidx/* dependency (dl.google.com), and the rest of the Java
# ecosystem (repo.maven.apache.org) — none of which a locked-down egress
# proxy allows through. GitHub-hosted runners have normal internet
# access, so this is the first point in the pipeline all of that actually
# resolves.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {} # manual "Run workflow" button — useful for a one-off build without touching main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Root-level install: apps/web depends on the @nexus/shared
      # workspace package (packages/shared), same as any local `npm
      # install` at the repo root.
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the SDK components AGP needs (platform, build-tools) —
      # this step alone needs dl.google.com, which is exactly what's
      # blocked in the sandboxed environment this workflow replaces.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
